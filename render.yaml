services:
  - type: web
    name: gigly
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Gigly
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gigly-db
          property: connectionString
      - key: PLATFORM_SELLER_FEE_PERCENT
        value: "10.0"
      - key: PLATFORM_BUYER_FEE_PERCENT
        value: "3.0"

databases:
  - name: gigly-db
    databaseName: gigly
    user: gigly_user
